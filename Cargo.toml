[workspace]
resolver = "2"
members = [
    "crates/vrc-schema",
    "crates/vrc-extractor",
    "crates/vrc-physics",
    "crates/vrc-renderer",
    "crates/vrc-ai",
    "crates/vrc-mascot-app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["neko-0406"]

[workspace.dependencies]
# Internal workspace crates
vrc-schema = { path = "crates/vrc-schema" }
vrc-extractor = { path = "crates/vrc-extractor" }
vrc-physics = { path = "crates/vrc-physics" }
vrc-renderer = { path = "crates/vrc-renderer" }
vrc-ai = { path = "crates/vrc-ai" }

# Serialization & Config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
directories = "6.0.0"
dotenvy = "0.15.7"

# Math & Utilities
glam = { version = "0.34.3", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.9", features = ["derive"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
base64 = "0.23.1"
pollster = "1.0.3"
tempfile = "3.27.0"

# Unity / 3D Asset Parsing
yaml-rust2 = "0.13.1"
ufbx = "0.11.5"
gltf = "1.4.1"
image = "0.25.10"

# Graphics, UI & Windowing
wgpu = "30.0.2"
winit = "0.30.13"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
tray-icon = "0.26.1"
rfd = { version = "0.18.0", default-features = false, features = ["common-controls-v6"] }

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Async, Networking & Audio
[workspace.dependencies.tokio]
version = "1.54.1"
features = ["full"]

[workspace.dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls", "charset", "http2", "system-proxy"]

[workspace.dependencies.rodio]
version = "0.23.0"

[workspace.dependencies.wasapi]
version = "0.27.0"

[workspace.dependencies.rustfft]
version = "6.4.1"
